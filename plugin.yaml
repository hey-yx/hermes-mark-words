name: hermes-mark-words
version: "0.25.0"
description: "Underlines words in Hermes Desktop assistant replies that are worth doubting (suspected inventions, unclear or ambiguous usages) and explains them on hover; everyday words and settled technical terms stay clean and any language is accepted. Ordinary doubt gets a neutral dotted underline, suspected inventions a thin red wavy one. Mark relations come in-band from the reply itself (::hmw directives the main model appends, rendered invisible) and are applied immediately with zero extra model calls; the plugin never issues model requests of its own, so a reply without markers simply gets no marks. The bundled reply-word-marks skill teaches the main model when and how to write those markers and ships with the plugin. Every reply's marks are stored by its text so they are pinned back after re-renders, session switches and plugin reloads; the settings page documents both mark states with samples. Offers ready-to-ask follow-up questions (zero to two per word) whose icon button fills the composer without sending."
author: "hey-yx"
kind: standalone
requires_hermes: ">=0.22.0"
requires_env: []
provides_tools: []
provides_hooks: []
